name: Windows build

# Manual (Actions tab -> Windows build -> Run workflow). Builds with Visual Studio 2022 (x64, AVX2) and runs the
# verification suite on a real Windows machine; the test output is shown in the run's summary.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build and test (Windows, MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Tests
        shell: pwsh
        run: |
          $out = & .\build\Release\hc_tests.exe 2>&1
          $code = $LASTEXITCODE
          $out | Out-File test_results.txt -Encoding utf8
          $out | Out-Host
          $pass = ($out | Select-String '^\[PASS\]').Count
          $fail = ($out | Select-String '^\[FAIL\]').Count
          "## Tests: $pass passed, $fail failed" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $out | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "::notice title=tests::$pass passed, $fail failed"
          if ($code -ne 0 -or $fail -gt 0) { exit 1 }

      - name: Keep the programs
        uses: actions/upload-artifact@v4
        with:
          name: HybridCore2Elite-windows-x64
          path: |
            build/Release/*.exe
            test_results.txt
